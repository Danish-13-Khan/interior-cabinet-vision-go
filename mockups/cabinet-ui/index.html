<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cabinet Studio — UI mockups</title>
  <link rel="stylesheet" href="./mock.css" />
</head>
<body>
  <header class="chooser">
    <div>
      <strong>Cabinet Studio</strong>
      <span>Full UI mockups · colored webpage</span>
    </div>
    <nav id="variants" aria-label="Chrome variant"></nav>
    <nav id="steps" aria-label="Screen"></nav>
  </header>

  <main class="stage">
    <section class="app" id="app" data-variant="rayon" data-step="draw">
      <div class="app-top">
        <div class="brand"><i></i><b>Interiors</b><small>Kitchen run · GCR-001</small></div>
        <div class="modes" data-show="floor">
          <button type="button" class="is-on" data-tab="draw">Draw</button>
          <button type="button" data-tab="place">Place</button>
        </div>
        <div class="top-actions">
          <span>Undo</span><span>Redo</span>
          <div class="seg" data-hide="floor">
            <button type="button" class="is-on" data-view="2d">2D</button>
            <button type="button" data-view="3d">3D</button>
          </div>
          <button type="button" class="ghost">Save</button>
          <button type="button" class="ghost">Export</button>
          <button type="button" class="present-btn">Present</button>
        </div>
      </div>

      <div class="home">
        <div>
          <p class="kicker">New project</p>
          <h1>Name the room,<br />then draw.</h1>
          <label>Project name<input value="Kitchen run" /></label>
          <div class="row">
            <button type="button" class="primary">Create room</button>
            <button type="button" class="ghost">Open file</button>
          </div>
        </div>
        <aside>
          <p class="kicker">Start from</p>
          <button type="button">Blank room</button>
          <button type="button" class="is-pick">Kitchen cabinet run</button>
          <p class="note">Recent files appear here. No living-room demo.</p>
        </aside>
      </div>

      <div class="workspace">
        <aside class="rail" id="rail"></aside>
        <section class="canvas">
          <svg viewBox="0 0 720 440" aria-label="Kitchen plan">
            <rect class="floor" x="110" y="58" width="480" height="300" />
            <rect class="wall" x="106" y="54" width="488" height="308" />
            <rect class="gap" x="104" y="230" width="16" height="78" />
            <rect class="gap" x="110" y="78" width="16" height="96" />
            <text x="350" y="42">6000 mm</text>
            <g class="cabs">
              <rect x="148" y="66" width="40" height="96" />
              <rect x="190" y="66" width="78" height="56" />
              <rect x="270" y="66" width="78" height="56" />
              <rect x="350" y="66" width="78" height="56" />
              <rect x="556" y="96" width="24" height="78" />
              <rect x="556" y="184" width="24" height="78" />
            </g>
          </svg>
          <div class="sheet">
            <p class="kicker">Present</p>
            <p class="total">₹16,859</p>
            <small>GCR-001 · Rev A · live</small>
            <button type="button" class="ghost">Freeze quote</button>
            <button type="button" class="ghost">Create proposal</button>
            <button type="button" class="primary">Send to Engineering</button>
          </div>
        </section>
        <aside class="props" id="props"></aside>
      </div>

      <div class="app-bottom">
        <div class="views" data-show="floor">
          <button type="button" class="is-on">2D</button>
          <button type="button">3D</button>
          <button type="button">Present</button>
        </div>
        <small>Snap 50 mm · Ortho · mm</small>
        <div class="closebar">
          <b>₹16,859</b><span>Rev A live</span>
          <button type="button" class="ghost">Freeze</button>
          <button type="button" class="ghost">Proposal</button>
          <button type="button" class="primary">Send</button>
        </div>
      </div>

      <div class="dialog">
        <p class="kicker">New project</p>
        <h2>Kitchen run</h2>
        <div class="row">
          <button type="button" class="primary">Create</button>
          <button type="button" class="ghost">Open</button>
        </div>
      </div>
    </section>
  </main>
  <script src="./mock.js"></script>
</body>
</html>
