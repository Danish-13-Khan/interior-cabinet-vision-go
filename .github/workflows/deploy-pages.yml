name: Deploy GitHub Pages

# Publishes Vite build to the gh-pages branch.
# One-time repo setup (required):
#   1. Repo must be Public (free Pages) OR have a plan that allows private Pages
#   2. Settings → Pages → Source: Deploy from a branch
#   3. Branch: gh-pages / (root) → Save
# Site: https://Danish-13-Khan.github.io/interior-cabinet-vision-go/

on:
  push:
    branches:
      - main
      - codex/living-room-visualizer-mvp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          touch dist/.nojekyll
          echo "Build OK — publishing to gh-pages"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Deployment published
        run: |
          echo "gh-pages branch updated."
          echo "If the site URL still 404s, enable Pages once:"
          echo "Settings → Pages → Deploy from a branch → gh-pages → / (root)"
          echo "URL: https://Danish-13-Khan.github.io/interior-cabinet-vision-go/"
