name: Deploy GitHub Pages

# Publishes Vite build to the gh-pages branch.
# One-time repo setup (required):
#   1. Repo must be Public (free Pages) OR have a plan that allows private Pages
#   2. Settings → Pages → Source: Deploy from a branch
#   3. Branch: gh-pages / (root) → Save
# Custom domain: https://modumitrasoftware.com/
# Also: https://Danish-13-Khan.github.io/interior-cabinet-vision-go/

on:
  push:
    branches:
      - main
      - codex/living-room-visualizer-mvp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify built-in catalog integrity
        run: npm run catalog:verify

      - name: Build web app
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_FLOORPLAN_API_BASE: https://cabinet-floorplan.onrender.com

      - name: Add standalone UI mockups
        run: |
          mkdir -p dist/mockups
          cp docs/mockups/interiors-chrome-mockups.html dist/mockups/

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/mockups/interiors-chrome-mockups.html
          touch dist/.nojekyll
          # GitHub Pages has no SPA rewrites — serve the app shell for unknown paths
          # so /app, /login, /register work on hard refresh / deep link.
          cp dist/index.html dist/404.html
          echo "Build OK — publishing to gh-pages"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: modumitrasoftware.com

      - name: Deployment published
        run: |
          echo "gh-pages branch updated."
          echo "If the site URL still 404s, enable Pages once:"
          echo "Settings → Pages → Deploy from a branch → gh-pages → / (root)"
          echo "URL: https://modumitrasoftware.com/"
          echo "Fallback: https://Danish-13-Khan.github.io/interior-cabinet-vision-go/"
