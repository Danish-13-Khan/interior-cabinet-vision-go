name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  golden:
    name: Unit, build, Golden journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify built-in catalog integrity
        run: npm run catalog:verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit and domain tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Golden journey and release-demo reopen
        run: npm run test:golden
