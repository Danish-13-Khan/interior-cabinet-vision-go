  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;cabinet-studio-directions&quot;);
    if (!root) return;
    let activeScreen = &quot;projects&quot;;
    let activeVariant = &quot;a&quot;;
    const captions = {
      &quot;projects-a&quot;: [&quot;Projects · Calm guided&quot;, &quot;Recommended: begin with the job, then enter one obvious design canvas.&quot;],
      &quot;projects-b&quot;: [&quot;Projects · Compact pro&quot;, &quot;Alternative: faster scanning for a shop handling many active jobs.&quot;],
      &quot;room-a&quot;: [&quot;Draw room · Calm guided&quot;, &quot;Recommended: labeled tools, large canvas, and properties only for the selected wall.&quot;],
      &quot;room-b&quot;: [&quot;Draw room · Compact pro&quot;, &quot;Alternative: icon rail and a floating contextual editor maximize drawing space.&quot;],
      &quot;cabinets-a&quot;: [&quot;Cabinet run · Calm guided&quot;, &quot;Recommended: cabinet families stay first-class and the selected cabinet remains editable in 3D.&quot;],
      &quot;cabinets-b&quot;: [&quot;Cabinet run · Compact pro&quot;, &quot;Alternative: denser catalog and floating dimensions for experienced users.&quot;],
      &quot;present-a&quot;: [&quot;Present &amp; send · Calm guided&quot;, &quot;Recommended: price, freeze, proposal, approval, then same-ID engineering handoff.&quot;],
      &quot;present-b&quot;: [&quot;Present &amp; send · Compact pro&quot;, &quot;Alternative: a dedicated close screen makes revision status and deliverables explicit.&quot;]
    };

    function render() {
      root.querySelectorAll(&quot;.cs-app&quot;).forEach((panel) =&gt; {
        panel.hidden = panel.dataset.screen !== activeScreen || panel.dataset.variant !== activeVariant;
      });
      root.querySelectorAll(&quot;[data-screen-control]&quot;).forEach((button) =&gt; {
        const selected = button.dataset.screenControl === activeScreen;
        button.classList.toggle(&quot;is-selected&quot;, selected);
        button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      });
      root.querySelectorAll(&quot;[data-variant-control]&quot;).forEach((button) =&gt; {
        const selected = button.dataset.variantControl === activeVariant;
        button.classList.toggle(&quot;is-selected&quot;, selected);
        button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      });
      const caption = captions[`${activeScreen}-${activeVariant}`];
      root.querySelector(&quot;#cs-caption-title&quot;).textContent = caption[0];
      root.querySelector(&quot;#cs-caption-copy&quot;).textContent = caption[1];
    }

    root.querySelectorAll(&quot;[data-screen-control]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
      activeScreen = button.dataset.screenControl;
      render();
    }));
    root.querySelectorAll(&quot;[data-variant-control]&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
      activeVariant = button.dataset.variantControl;
      render();
    }));
    root.querySelectorAll(&quot;.cs-freeze-action&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
      const app = button.closest(&quot;.cs-app&quot;);
      button.textContent = &quot;Quote frozen&quot;;
      button.disabled = true;
      app.querySelectorAll(&quot;.is-locked button&quot;).forEach((action) =&gt; action.disabled = false);
      app.querySelectorAll(&quot;.is-locked&quot;).forEach((section) =&gt; section.classList.remove(&quot;is-locked&quot;));
      app.querySelectorAll(&quot;.cs-approval-action&quot;).forEach((approval) =&gt; approval.disabled = false);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }));
    root.querySelectorAll(&quot;.cs-approval-action&quot;).forEach((button) =&gt; button.addEventListener(&quot;click&quot;, () =&gt; {
      const app = button.closest(&quot;.cs-app&quot;);
      button.textContent = &quot;Approved&quot;;
      button.disabled = true;
      app.querySelectorAll(&quot;.cs-send-action&quot;).forEach((send) =&gt; {
        send.disabled = false;
        send.innerHTML = &#x27;&lt;i data-lucide=&quot;send&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Send to engineering&#x27;;
      });
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }));
    render();
  })();
&lt;/script&gt;
